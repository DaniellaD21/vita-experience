<title>Detalles de tu boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500&family=Jost:wght@400&family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Heebo:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one centered column like a wedding stationery card; sticky step bar on top, sticky action bar at the bottom. Single light look by design (ivory paper). */
:root{
  --ivory:#F8F6F1; --paper:#FFFFFF; --sand:#D8CFC2; --sand-2:#EAE3D8; --sage:#A5AA98; --sage-ink:#5E6253;
  --rosa:#E4007C; --rosa-ink:#C4006B; --rosa-soft:#FCEAF3; --gold:#B8913A; --gold-soft:#E9D9AE; --ink:#2F3129; --ink-2:#4A4744; --muted:#6B675F;
  --f-display:'Instrument Serif','Didot',Georgia,serif; --f-brand:'Instrument Sans',Arial,sans-serif; --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:6px; color-scheme:light;
}
:root[dir="rtl"]{ --f-display:'Frank Ruhl Libre','Times New Roman',serif; --f-brand:'Heebo',Arial,sans-serif; --f-body:'Heebo','Arial Hebrew',Arial,sans-serif; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ivory);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ivory)}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--rosa-ink)}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(248,246,241,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--sand-2)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:34px;width:auto}
.wm{font-family:var(--f-brand);font-size:13px;letter-spacing:.16em;color:#1F1D1B;white-space:nowrap}
.langs{display:flex;border:1px solid var(--sand);border-radius:999px;padding:2px;background:var(--paper)}
.langs button{border:0;background:none;padding:6px 11px;min-height:32px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--ivory)}
.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0 10px}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 8px;border-radius:999px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:34px}
.steps button .dot{width:20px;height:20px;border-radius:50%;border:1px solid var(--sand);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:var(--paper)}
.steps button.done .dot{background:var(--gold-soft);border-color:var(--gold);color:#6E5520}
.steps button[aria-current="step"]{color:var(--ink);font-weight:600}
.steps button[aria-current="step"] .dot{background:var(--rosa);border-color:var(--rosa);color:#fff}
.steps button:disabled{cursor:default;opacity:.55}

/* hero */
.hero{text-align:center;padding-block:34px 8px;position:relative}
.eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#8E6F33;font-family:var(--f-brand);font-weight:600;margin:0}
:root[dir="rtl"] .eyebrow{letter-spacing:.02em;font-size:14px}
.hero h1{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(32px,7vw,46px);line-height:1.08;margin:12px auto 10px;max-width:16em;text-wrap:balance}
:root[dir="rtl"] .hero h1{font-style:normal}
.hero p{margin:0 auto;max-width:34em;color:var(--ink-2);font-size:15.5px}
.rule{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px}
.rule span{width:42px;height:1px;background:var(--gold)}
.rule i{width:6px;height:6px;border:1px solid var(--gold);transform:rotate(45deg)}
.sprig{position:absolute;top:6px;inset-inline-end:-8px;width:110px;height:140px;opacity:.45;pointer-events:none}
.sprig path{fill:none;stroke:var(--rosa);stroke-width:1.3;stroke-linecap:round}
.sprig circle{fill:var(--rosa)}

/* panels */
form{padding-bottom:120px}
.panel{border:0;margin:22px 0 0;padding:0;min-width:0}
.panel[hidden]{display:none!important}
.phead{margin-bottom:18px}
.phead .num{font-family:var(--f-display);font-size:15px;color:var(--gold);font-weight:600;letter-spacing:.06em}
.phead h2{font-family:var(--f-display);font-weight:500;font-style:italic;font-size:30px;line-height:1.1;margin:2px 0 4px;text-wrap:balance}
:root[dir="rtl"] .phead h2{font-style:normal}
.phead p{margin:0;color:var(--ink-2);font-size:15px}
.card{background:var(--paper);border:1px solid var(--sand-2);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:18px}
.card + .card{margin-top:14px}
.card h3{margin:0;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage-ink);font-weight:600}
:root[dir="rtl"] .card h3{letter-spacing:0;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 16px}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > label,.lbl{font-size:14.5px;font-weight:600;color:var(--ink)}
.rq{color:var(--rosa-ink);margin-inline-start:3px;font-weight:600}
.help{font-size:13px;color:var(--muted);margin:-2px 0 0}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=url],input[type=time],select,textarea{
  width:100%;min-height:46px;border:1px solid var(--sand);border-radius:var(--r);background:#FFFEFC;padding:10px 12px;font-size:16px;color:var(--ink);transition:border-color .15s, box-shadow .15s}
textarea{min-height:92px;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:#A39E95}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rosa);box-shadow:0 0 0 3px rgba(228,0,124,.14)}
.invalid input,.invalid select,.invalid textarea{border-color:#B3261E}
.err{margin:0;font-size:13px;color:#B3261E;font-weight:500}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:15px;cursor:pointer;min-height:28px}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--rosa);flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--sand);border-radius:999px;background:#FFFEFC;font-size:14.5px;color:var(--ink-2)}
.chip input:checked + span{border-color:var(--rosa);background:var(--rosa-soft);color:var(--rosa-ink);font-weight:600}
.chip input:focus-visible + span{outline:2px solid var(--rosa);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--sand);border-radius:999px;padding:3px;background:#FFFEFC;align-self:flex-start}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:inline-block;padding:7px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.seg input:checked + span{background:var(--ink);color:var(--ivory)}
.seg input:focus-visible + span{outline:2px solid var(--rosa)}
.note{font-size:13.5px;color:var(--sage-ink);background:#F3F2EC;border-radius:var(--r);padding:10px 12px;margin:0}
.note.rosa{background:var(--rosa-soft);color:#8F004E}

/* itinerary */
.itin{display:flex;flex-direction:column;gap:8px}
.irow{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:8px}
.irow button,.iconbtn{width:44px;min-height:46px;border:1px solid var(--sand);border-radius:var(--r);background:#FFFEFC;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.irow button:hover,.iconbtn:hover{color:#B3261E;border-color:#E3B5B0}
.addbtn{align-self:flex-start;border:1px dashed var(--gold);background:none;color:#7A5E22;border-radius:999px;padding:8px 16px;min-height:40px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* packages */
.pkgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.pkgs{grid-template-columns:minmax(0,1fr)}}
.pkg{position:relative;display:block;cursor:pointer}
.pkg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pkg .in{height:100%;display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--sand);border-radius:var(--r);background:#FFFEFC;transition:border-color .15s, box-shadow .15s}
.pkg input:checked + .in{border-color:var(--rosa);box-shadow:0 0 0 2px var(--rosa) inset;background:#FFFBFD}
.pkg input:focus-visible + .in{outline:2px solid var(--rosa);outline-offset:2px}
.pkg .nm{font-family:var(--f-brand);font-size:15px;letter-spacing:.08em}
:root[dir="rtl"] .pkg .nm{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:0}
.pkg .pr{font-family:var(--f-display);font-size:30px;font-weight:400;color:#8E6F33;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.pkg .ds{font-size:13.5px;color:var(--ink-2);line-height:1.4}
.pkg .bd{align-self:flex-start;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--gold);color:#fff;padding:3px 8px;border-radius:2px;font-weight:600}
:root[dir="rtl"] .pkg .bd{letter-spacing:0;font-size:12px}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding-block:12px;border-top:1px solid var(--sand-2)}
.xrow:first-of-type{border-top:0;padding-top:0}
.xrow .t{font-weight:600;font-size:15px}
.xrow .h{font-size:13px;color:var(--muted)}
.xrow .p{font-size:13.5px;font-weight:600;color:var(--rosa-ink);white-space:nowrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--sand);border-radius:999px;background:#FFFEFC}
.stepper button{width:40px;height:40px;border:0;background:none;font-size:20px;color:var(--ink);cursor:pointer;border-radius:999px}
.stepper button:disabled{color:#C9C3B9;cursor:default}
.stepper output{min-width:26px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.sw{position:relative;width:46px;height:28px;flex:0 0 auto}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--sand);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.sw input:checked + span{background:var(--rosa)}
.sw input:checked + span::after{transform:translateX(18px)}
:root[dir="rtl"] .sw input:checked + span::after{transform:translateX(-18px)}
.sw input:disabled + span{opacity:.5}
.sw input:focus-visible + span{outline:2px solid var(--rosa);outline-offset:2px}
.est{border:1px solid var(--gold-soft);background:linear-gradient(180deg,#FFFDF6,#FBF5E6);border-radius:var(--r);padding:18px 20px}
.est h3{color:#7A5E22}
.est ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.est li{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.est li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.est .tot{margin-top:10px;padding-top:10px;border-top:1px solid var(--gold-soft);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.est .tot b{font-family:var(--f-display);font-size:28px;font-weight:400;color:#8E6F33;font-variant-numeric:lining-nums tabular-nums}
.est .sm{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.inc{color:var(--sage-ink);font-style:italic}

/* styles gallery */
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.sty{position:relative;display:block;cursor:pointer}
.sty > input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:2}
.sty .in{height:100%;display:flex;flex-direction:column;gap:10px;padding:16px 14px 14px;border:1px solid var(--sand-2);border-radius:var(--r);background:var(--paper);transition:border-color .15s, box-shadow .15s, transform .15s}
.sty:hover .in{transform:translateY(-2px);box-shadow:0 8px 20px rgba(46,43,40,.07)}
.sty > input:checked + .in{border-color:var(--rosa);box-shadow:0 0 0 2px var(--rosa) inset}
.sty > input:focus-visible + .in{outline:2px solid var(--rosa);outline-offset:2px}
.sty .stage{display:block;background:linear-gradient(180deg,#F4F0EA,#ECE5DA);border-radius:4px;padding:14px 0}
.sty .nm{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.1;margin:0}
.sty .ds{font-size:13.5px;color:var(--ink-2);margin:0;line-height:1.4}
.sty .pick{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--sand);border-radius:999px;padding:5px 12px}
.sty > input:checked + .in .pick{background:var(--rosa);border-color:var(--rosa);color:#fff}
.sty.help .stage{display:flex;align-items:center;justify-content:center;min-height:266px}
.sty.help .q{font-family:var(--f-display);font-size:72px;color:var(--gold);line-height:1}

/* phone previews (original animations) */
.ph{display:block;position:relative;width:128px;height:236px;margin:0 auto;border-radius:22px;border:5px solid #1F1D1B;overflow:hidden;background:#111;box-shadow:0 10px 22px rgba(46,43,40,.18);direction:ltr}
.ph > *{position:absolute}
.ph .nm2{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:16px;line-height:1.1;text-align:center}
.ph .sub{font-family:'Jost',sans-serif;font-size:8.5px;letter-spacing:.2em}
/* A heart */
.sA{background:radial-gradient(circle at 50% 40%,#8E1426,#5A0715)}
.aFrame{left:14px;right:14px;top:28px;bottom:40px;border:2px solid #D9B45B;border-radius:56px 56px 10px 10px;box-shadow:inset 0 0 0 4px #7A0E1F,inset 0 0 0 5px #D9B45B;background:radial-gradient(circle at 50% 45%,#F3E3C6,#E2C9A0);animation:aF 7s infinite ease-in-out}
.aHeart{left:calc(50% - 22px);top:calc(46% - 20px);width:44px;height:41px;animation:aH 7s infinite ease-in-out}
.aHeart path{fill:#C8102E;stroke:#D9B45B;stroke-width:1.4}
.aRev{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#F3D9A4;opacity:0;animation:aR 7s infinite ease-in-out}
.aRev .ln{width:40px;height:1px;background:#D9B45B}
@keyframes aH{0%,100%{transform:scale(1);opacity:1}8%{transform:scale(1.13)}16%{transform:scale(1)}24%{transform:scale(1.13)}32%{transform:scale(.9)}40%,90%{transform:scale(0);opacity:0}}
@keyframes aF{0%,34%{opacity:1;transform:scale(1)}44%,90%{opacity:0;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes aR{0%,40%{opacity:0;transform:translateY(8px)}52%,86%{opacity:1;transform:none}94%,100%{opacity:0}}
/* B doors */
.sB{background:#F6F0E8}
.bIn{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#7A1730;background:radial-gradient(circle at 50% 30%,#FFFDF8,#F1E7DA)}
.bIn .col{position:absolute;top:22px;bottom:18px;width:15px;border-radius:8px 8px 0 0;background:repeating-linear-gradient(90deg,#E6D8C4 0 3px,#F8F1E7 3px 6px)}
.bIn .col.l{left:9px}.bIn .col.r{right:9px}
.bIn .sub{font-size:7.5px;letter-spacing:.1em}
.bIn .arch{position:absolute;left:26px;right:26px;top:16px;height:60px;border:1px solid #C9A85C;border-bottom:0;border-radius:40px 40px 0 0}
.door{top:0;bottom:0;width:50%;background:radial-gradient(circle at 25% 25%,#B5123B 0 2.5px,transparent 3.5px),radial-gradient(circle at 75% 70%,#B5123B 0 2px,transparent 3px),radial-gradient(circle at 70% 25%,#6E8B5E 0 1.6px,transparent 2.6px),radial-gradient(circle at 25% 75%,#6E8B5E 0 1.6px,transparent 2.6px),#F4EEE6;background-size:20px 20px}
.door.dl{left:0;border-right:1px solid #C9A85C;animation:bL 7s infinite ease-in-out}
.door.dr{right:0;border-left:1px solid #C9A85C;animation:bR 7s infinite ease-in-out}
.door::after{content:"";position:absolute;top:50%;width:4px;height:14px;border-radius:2px;background:#C9A85C}
.door.dl::after{right:5px}.door.dr::after{left:5px}
@keyframes bL{0%,22%{transform:translateX(0)}45%,84%{transform:translateX(-100%)}96%,100%{transform:translateX(0)}}
@keyframes bR{0%,22%{transform:translateX(0)}45%,84%{transform:translateX(100%)}96%,100%{transform:translateX(0)}}
/* C ivory envelope */
.sC{background:linear-gradient(160deg,#EFE8DC,#E2D8C8)}
.cEnv{left:12px;right:12px;bottom:46px;height:84px;perspective:320px}
.cEnv > *{position:absolute}
.cCard{left:8px;right:8px;bottom:6px;height:76px;background:#FFFDF8;border:1px solid #E3D8C6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#5A4632;z-index:1;animation:cC 7s infinite ease-in-out}
.cCard .lf{width:34px;height:9px;border-radius:50%;background:#A5AA98;opacity:.8}
.cPocket{inset:0;background:#F7F1E6;border:1px solid #DCCFBB;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:2}
.cFlap{left:0;right:0;top:0;height:52px;background:#F1E9DB;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:3;animation:cF 7s infinite ease-in-out}
.cSeal{left:calc(50% - 13px);top:38px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#C23A47,#8E1A26);box-shadow:0 1px 2px rgba(0,0,0,.3);z-index:4;animation:cS 7s infinite ease-in-out}
@keyframes cS{0%,14%{opacity:1;transform:scale(1)}22%,90%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes cF{0%,16%{transform:rotateX(0);z-index:3}30%{z-index:3}32%,86%{transform:rotateX(180deg);z-index:0}96%,100%{transform:rotateX(0);z-index:3}}
@keyframes cC{0%,34%{transform:translateY(0)}54%,86%{transform:translateY(-94px)}96%,100%{transform:translateY(0)}}
/* D olive */
.sD{background:linear-gradient(170deg,#3A3027,#5A4636)}
.dEnv{left:14px;right:14px;top:70px;height:96px;background:#8E9A72;border-radius:3px;animation:dE 7s infinite ease-in-out}
.dEnv > *{position:absolute}
.dFlap{left:0;right:0;top:0;height:56px;background:#7F8C64;clip-path:polygon(0 0,100% 0,50% 100%)}
.dSeal{left:calc(50% - 12px);top:44px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E8C979,#B08A33)}
.dCard{left:14px;right:14px;top:36px;bottom:36px;background:#FBF8F1;border-radius:6px;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#4E5A3A}
.dCard .pic{width:70px;height:56px;background:linear-gradient(#DDE3CF,#8E9A72);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.dCard .cal{position:relative;width:70px;height:48px;background:radial-gradient(circle,#B9B29F 1.2px,transparent 1.7px) 0 0/10px 10px}
.dCard .cal::after{content:"";position:absolute;left:38px;top:17px;width:14px;height:14px;border:1.5px solid #E4007C;border-radius:50%}
.dCard .land{width:76px;height:54px;border-radius:4px;background:linear-gradient(#EAD9B5 0 45%,#9AAE7A 45% 72%,#6F8455 72%)}
.k1{animation:dk1 7s infinite ease-in-out}.k2{animation:dk2 7s infinite ease-in-out}.k3{animation:dk3 7s infinite ease-in-out}
@keyframes dE{0%,22%{opacity:1;transform:none}32%,90%{opacity:0;transform:scale(.85) translateY(30px)}100%{opacity:1;transform:none}}
@keyframes dk1{0%,30%{opacity:0;transform:translateX(30px)}36%,52%{opacity:1;transform:none}58%,100%{opacity:0;transform:translateX(-30px)}}
@keyframes dk2{0%,54%{opacity:0;transform:translateX(30px)}60%,72%{opacity:1;transform:none}78%,100%{opacity:0;transform:translateX(-30px)}}
@keyframes dk3{0%,74%{opacity:0;transform:translateX(30px)}80%,92%{opacity:1;transform:none}98%,100%{opacity:0;transform:translateX(-30px)}}
/* E golden light */
.sE{background:#2A1810}
.eEnv{left:12px;right:12px;top:34px;bottom:34px;border-radius:4px;background:repeating-radial-gradient(circle at 50% 120%,#4A2C1E 0 6px,#5A3726 6px 7px);animation:eE 7s infinite ease-in-out}
.eEnv > *{position:absolute}
.eFlap{left:0;right:0;top:0;height:60%;background:repeating-radial-gradient(circle at 50% -20%,#4F2F20 0 5px,#62402D 5px 6px);clip-path:polygon(0 0,100% 0,50% 100%)}
.eSeal{left:calc(50% - 14px);top:calc(60% - 16px);width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F1C9A8,#C98F6E)}
.eGlow{left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:radial-gradient(circle,#FFF3C9 0,rgba(255,206,110,.75) 25%,rgba(255,170,60,0) 65%);opacity:0;transform:scale(.2);animation:eG 7s infinite ease-out}
.eCard{left:12px;right:12px;top:22px;bottom:22px;border:1px solid #D9B45B;border-radius:40px 40px 6px 6px;background:radial-gradient(circle at 50% 30%,#8A2A36,#5E1823);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#F3D9A4;opacity:0;animation:eC 7s infinite ease-in-out}
@keyframes eG{0%,20%{opacity:0;transform:scale(.2)}34%{opacity:1;transform:scale(1.3)}46%,100%{opacity:0;transform:scale(1.8)}}
@keyframes eE{0%,30%{opacity:1}40%,92%{opacity:0}100%{opacity:1}}
@keyframes eC{0%,38%{opacity:0;transform:scale(.94)}48%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
/* F roses & video */
.f1,.f2,.f3{inset:0}
.f1{background:#F3EEE4;animation:fA 7s infinite ease-in-out}
.f1 > *{position:absolute}
.f1 .r{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFFFFF 0 30%,#EEE7DA 60%,#DCD2C1);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.f1 .lv{width:16px;height:7px;border-radius:50%;background:#9AA884}
.fEnv{left:20px;right:20px;top:84px;height:68px;background:#FBF7EF;border:1px solid #E2D8C6;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.fEnv::before{content:"";position:absolute;left:0;right:0;top:0;height:40px;background:#F3ECDF;clip-path:polygon(0 0,100% 0,50% 100%)}
.fSeal{position:absolute;left:calc(50% - 14px);top:26px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E8C979,#A9822F)}
.f2{background:linear-gradient(180deg,#2F4A33,#18291C);opacity:0;overflow:hidden;animation:fB 7s infinite ease-in-out}
.f2 > *{position:absolute}
.f2 .nm2{left:0;right:0;top:38px;color:#F6F1E6}
.f2 .cm{left:44px;bottom:34px;width:16px;height:58px;background:#141414;border-radius:8px 8px 2px 2px}
.f2 .cw{left:58px;bottom:34px;width:28px;height:60px;background:#F7F4EE;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
.f2 .grass{left:0;right:0;bottom:0;height:40px;background:linear-gradient(#3E5C3F,#22382A)}
.f2 .play{right:10px;bottom:10px;width:0;height:0;border-left:9px solid rgba(255,255,255,.85);border-top:6px solid transparent;border-bottom:6px solid transparent}
.f3{background:#FBF9F4;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#5A5040;animation:fC 7s infinite ease-in-out}
.f3 .garl{position:absolute;left:0;right:0;top:0;height:46px;background:radial-gradient(circle,#FFFFFF 0 7px,#E6DED0 8px,transparent 9px) 0 0/22px 22px,radial-gradient(circle,#A9B48F 0 2px,transparent 3px) 11px 11px/22px 22px}
.f3 .garl.b{top:auto;bottom:0}
.f3 .cdn{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;letter-spacing:.06em;color:#8C6E2E}
@keyframes fA{0%,30%{opacity:1}38%,94%{opacity:0}100%{opacity:1}}
@keyframes fB{0%,32%{opacity:0;transform:scale(1)}40%{opacity:1}64%{opacity:1;transform:scale(1.12)}70%,100%{opacity:0;transform:scale(1.12)}}
@keyframes fC{0%,66%{opacity:0}74%,92%{opacity:1}98%,100%{opacity:0}}
/* G signature seal */
.sG{background:radial-gradient(circle at 50% 40%,#FFFDF9,#F4ECE3)}
.gSeal{left:calc(50% - 28px);top:calc(45% - 28px);width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F2489A,#C4006B);box-shadow:0 0 0 3px #F8F6F1,0 0 0 4.5px #C9A85C,0 4px 10px rgba(196,0,107,.3);color:#FFE9F3;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:18px;display:flex;align-items:center;justify-content:center;animation:gS 7s infinite ease-in-out}
.gRing{left:calc(50% - 28px);top:calc(45% - 28px);width:56px;height:56px;border-radius:50%;border:2px solid #E4007C;opacity:0;animation:gR 7s infinite ease-out}
.gTap{left:0;right:0;top:calc(45% + 40px);text-align:center;font-family:'Jost',sans-serif;font-size:8px;letter-spacing:.2em;color:#9A8F80;animation:gT 7s infinite}
.gRev{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#2E2B28;opacity:0;animation:gV 7s infinite ease-in-out}
.gRev .big{font-family:'Cormorant Garamond',Georgia,serif;font-size:27px;font-weight:500;color:#C4006B;letter-spacing:.04em}
.gRev .ln{width:36px;height:1px;background:#C9A85C}
@keyframes gS{0%,18%{transform:scale(1);opacity:1}22%{transform:scale(.9)}30%,92%{transform:scale(1.4);opacity:0}100%{opacity:1;transform:scale(1)}}

@keyframes gT{0%,18%{opacity:1}24%,94%{opacity:0}100%{opacity:1}}
@keyframes gV{0%,30%{opacity:0;transform:translateY(8px)}42%,86%{opacity:1;transform:none}94%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ph,.ph *{animation:none!important}}

/* palette */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pal{border:1px solid var(--sand);border-radius:var(--r);background:#FFFEFC;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:start;min-height:44px}
.pal[aria-pressed="true"]{border-color:var(--rosa);box-shadow:0 0 0 1px var(--rosa) inset}
.pal .bar{display:flex;height:22px;border-radius:3px;overflow:hidden;border:1px solid rgba(0,0,0,.05)}
.pal .bar i{flex:1}
.pal span{font-size:13px;font-weight:600;color:var(--ink-2)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches label{position:relative;width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 1px var(--sand),inset 0 0 0 3px #fff;cursor:pointer;overflow:hidden}
.swatches input{position:absolute;inset:-8px;width:64px;height:64px;border:0;padding:0;cursor:pointer;opacity:0}
.swatches.off{opacity:.35;pointer-events:none}

/* uploads */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:22px 16px;border:1.5px dashed var(--sand);border-radius:var(--r);background:#FDFCF9;text-align:center;cursor:pointer;color:var(--ink-2);transition:border-color .15s, background .15s}
.drop:hover,.drop.over{border-color:var(--rosa);background:var(--rosa-soft)}
.drop svg{width:28px;height:28px;stroke:var(--gold)}
.drop b{font-weight:600;font-size:15px}
.drop small{font-size:13px;color:var(--muted)}
.thumbs{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumbs li{position:relative;aspect-ratio:1;max-width:100%;border-radius:4px;overflow:hidden;background:var(--sand-2);border:1px solid var(--sand-2)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .doc{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--ink-2);padding:6px;text-align:center;word-break:break-all}
.thumbs button{position:absolute;top:4px;inset-inline-end:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(46,43,40,.72);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.thumbs button svg{width:14px;height:14px}

/* review */
.rv{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr) auto;gap:0 14px;margin:0}
.rv dt,.rv dd{padding-block:10px;border-top:1px solid var(--sand-2);margin:0}
.rv dt{font-size:13px;color:var(--muted);font-weight:600}
.rv dd{font-size:15px;min-width:0;overflow-wrap:anywhere}
.rv dt:first-of-type,.rv dd:nth-of-type(1),.rv dd:nth-of-type(2){border-top:0}
.rv .ed{border:0;background:none;color:var(--rosa-ink);font-weight:600;font-size:13px;cursor:pointer;padding:0 4px;min-height:32px}
@media (max-width:520px){.rv{grid-template-columns:minmax(0,1fr) auto}.rv dt{grid-column:1 / -1;padding-bottom:0}.rv dd{border-top:0;padding-top:2px}.rv dt:first-of-type{border-top:0}}

/* action bar */
.bar-act{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(248,246,241,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--sand-2);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar-act .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-size:15.5px;font-weight:600;cursor:pointer;border:1px solid transparent}
.btn.pri{background:var(--rosa-ink);color:#fff}
.btn.pri:hover{background:#A8005C}
.btn.pri:disabled{background:#D9A3C0;cursor:progress}
.btn.sec{background:transparent;border-color:var(--sand);color:var(--ink)}
.btn.sec[hidden]{display:none}
.count{font-size:13px;color:var(--muted);white-space:nowrap}
:root[dir="rtl"] .btn .ic.flip{transform:scaleX(-1)}
.sendmsg{margin:12px 0 0}

/* done */
.done{text-align:center;padding-block:60px 120px}
.done img{height:72px;width:auto}
.done h2{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(32px,7vw,44px);margin:18px 0 8px;text-wrap:balance}
:root[dir="rtl"] .done h2{font-style:normal}
.done p{max-width:30em;margin:0 auto;color:var(--ink-2)}
.preview{font-size:13px;background:#FFF6DB;border:1px solid var(--gold-soft);color:#6E5520;border-radius:var(--r);padding:10px 12px;margin:16px auto 0;max-width:34em}
.foot{text-align:center;font-size:12.5px;color:var(--muted);padding-block:26px 8px;letter-spacing:.04em}
.foot b{font-family:var(--f-brand);font-weight:400;letter-spacing:.16em}
</style>

/* ====== state ====== */
var form = document.getElementById('f');
var panels = [].slice.call(document.querySelectorAll('.panel'));
var lang = 'es', step = 0, maxStep = 0;
var files = {design:[],refs:[],photos:[]};
var currencyTouched = false;

function t(k, v){ var s = (I18N[lang] && I18N[lang][k]); if(s == null) s = I18N.es[k]; if(s == null) s = k; if(v){ for(var x in v){ s = s.split('{'+x+'}').join(v[x]); } } return s; }
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return [].slice.call((r||document).querySelectorAll(s)); }
function val(n){ var el = form.elements[n]; if(!el) return ''; return (el.value||'').trim(); }
function checked(n){ return $$('input[name="'+n+'"]:checked', form).map(function(i){ return i.value; }); }
function cur(){ return val('currency') || 'MXN'; }
function money(n){ var c = cur(); var s = Math.round(n).toLocaleString('en-US'); return c==='ILS' ? '₪'+s : '$'+s+' MXN'; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ====== render dynamic bits ====== */
function buildStatic(){
  var pals = $('#pals');
  PALETTES.forEach(function(p, i){
    var b = document.createElement('button'); b.type='button'; b.className='pal'; b.dataset.i = i; b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span class="bar">'+p[1].map(function(c){ return '<i style="background:'+c+'"></i>'; }).join('')+'</span><span data-i18n="'+p[0]+'"></span>';
    b.addEventListener('click', function(){ setPalette(i); saveDraftSoon(); });
    pals.appendChild(b);
  });
  var vib = $('#vibes');
  VIBES.forEach(function(v){ vib.insertAdjacentHTML('beforeend','<label class="chip"><input type="checkbox" name="vibe" value="'+v+'"><span data-i18n="v_'+v+'"></span></label>'); });
  var men = $('#menus');
  MENUS.forEach(function(m){ men.insertAdjacentHTML('beforeend','<label class="chip"><input type="checkbox" name="menu" value="'+m+'"'+(m==='regular'?' checked':'')+'><span data-i18n="m_'+m+'"></span></label>'); });
  var nav = $('#steps');
  for(var i=0;i<STEPS;i++){
    var b = document.createElement('button'); b.type='button'; b.dataset.go=i;
    b.innerHTML = '<span class="dot">'+(i+1)+'</span><span data-i18n="s'+i+'"></span>';
    b.addEventListener('click', function(){ var g=+this.dataset.go; if(g<=maxStep) go(g); });
    nav.appendChild(b);
  }
}
function setPalette(i){
  var p = PALETTES[i][1];
  $$('#swatches input').forEach(function(inp, k){ inp.value = p[k]; inp.parentNode.style.background = p[k]; });
  $$('.pal').forEach(function(b){ b.setAttribute('aria-pressed', String(+b.dataset.i===i)); });
  form.dataset.palette = PALETTES[i][0];
}
function paintSwatches(){ $$('#swatches input').forEach(function(inp){ inp.parentNode.style.background = inp.value; }); }

function applyLang(l){
  lang = l;
  var root = document.documentElement; root.lang = l; root.dir = (l==='he'?'rtl':'ltr');
  $$('.langs button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang===l)); });
  $$('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
  if(!currencyTouched){ var want = (l==='es' ? 'MXN' : 'ILS'); var r = $('input[name="currency"][value="'+want+'"]'); if(r) r.checked = true; }
  $$('.irow input[data-k="event"]').forEach(function(i){ i.placeholder = t('ph_event'); });
  $$('.irow button').forEach(function(b){ b.setAttribute('aria-label', t('b_remove')); });
  refresh();
}

function refresh(){
  var P = PRICES[cur()];
  $$('[data-price]').forEach(function(el){ el.textContent = money(P[el.dataset.price]); });
  var pkg = val('pkg');
  // langs note
  var nl = $('#n_langs'); nl.hidden = pkg!=='esencial'; nl.textContent = t('n_langs',{p:money(P.lang)});
  $('#h_guests').textContent = t('h_guests',{p:money(P.g100)});
  // std
  var std = $('#x_std');
  if(pkg==='premium'){ std.checked = true; std.disabled = true; $('#h_std').textContent = t('included'); }
  else { if(std.disabled){ std.checked = false; } std.disabled = false; $('#h_std').textContent = money(P.std); }
  $('#p_event').textContent = '· '+money(P.event)+' '+t('each') + (pkg==='premium' ? ' · '+t('premium_one') : '');
  $('#p_rem').textContent = '· '+money(P.reminder)+' '+t('each');
  // reminders only for completa / premium
  var es = pkg==='esencial';
  $('#remRow').hidden = es; $('#n_rem_es').hidden = !es;
  if(es) setCount('x_rem', 0);
  $('#remKnownBox').hidden = es; $('#n_rem_none').hidden = !es;
  $('#remDates').hidden = es || val('rem_known')!=='yes';
  $('#eventsWhichBox').hidden = +val('x_events')===0 && pkg!=='premium';
  // design note
  var hd = val('hasdesign'), nd = $('#n_design');
  if(hd==='no'){ nd.hidden=false; nd.textContent = pkg==='premium' ? t('n_design_inc') : t('n_design_extra',{p:money(P.design)}); } else nd.hidden = true;
  $('#designUpBox').hidden = hd!=='yes';
  // swatches
  $('#swatches').classList.toggle('off', $('#nocolors').checked);
  // style pick labels
  $$('.sty').forEach(function(s){ var on = s.querySelector('input').checked; s.querySelector('.pick span').textContent = on ? t('sty_picked') : t('sty_pick'); });
  renderEstimate();
  renderNav();
}

function estimate(){
  var pkg = val('pkg'); if(!pkg) return null;
  var P = PRICES[cur()], lines = [], total = 0;
  function add(label, amt){ lines.push([label, amt]); if(typeof amt==='number') total += amt; }
  var names = pkgNames();
  var base = P[pkg]; add(t('est_pkg',{n:names[pkg]}), base);
  if(val('hasdesign')==='no') add(t('est_design'), pkg==='premium' ? 'inc' : P.design);
  if($('#x_std').checked) add(t('est_std'), pkg==='premium' ? 'inc' : P.std);
  var ev = +val('x_events') || 0;
  if(pkg==='premium'){ if(ev>0){ var extra = Math.max(0, ev-1); add(t('est_events',{n:ev}), extra? extra*P.event : 'inc'); } }
  else if(ev>0) add(t('est_events',{n:ev}), ev*P.event);
  var nl = checked('langs').length;
  if(pkg==='esencial' && nl>1) add(t('est_langs',{n:nl-1}), (nl-1)*P.lang);
  var rm = +val('x_rem') || 0; if(pkg!=='esencial' && rm>0) add(t('est_rem',{n:rm}), rm*P.reminder);
  var g = parseInt(val('guests'),10) || 0;
  if(g>300){ var blocks = Math.ceil((g-300)/100); add(t('est_guests',{n:blocks*100}), blocks*P.g100); }
  if($('#x_urgent').checked) add(t('est_urgent'), Math.round(base*0.3));
  return {lines:lines, total:total, currency:cur()};
}
function renderEstimate(){
  var e = estimate(), ul = $('#estLines');
  if(!e){ ul.innerHTML = '<li><span>'+esc(t('est_empty'))+'</span></li>'; $('#estTotal').textContent = '—'; return; }
  ul.innerHTML = e.lines.map(function(l){ return '<li><span>'+esc(l[0])+'</span><span>'+(l[1]==='inc' ? '<span class="inc">'+esc(t('est_inc'))+'</span>' : esc(money(l[1])))+'</span></li>'; }).join('');
  $('#estTotal').textContent = money(e.total);
}

/* ====== itinerary ====== */
function addRow(time, ev){
  var row = document.createElement('div'); row.className='irow';
  row.innerHTML = '<input type="time" data-k="time" aria-label="Hora" value="'+esc(time||'')+'"><input type="text" data-k="event" aria-label="Evento" value="'+esc(ev||'')+'"><button type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  row.querySelector('[data-k="event"]').placeholder = t('ph_event');
  row.querySelector('button').setAttribute('aria-label', t('b_remove'));
  row.querySelector('button').addEventListener('click', function(){ row.remove(); if(!$$('.irow').length) addRow(); saveDraftSoon(); });
  $('#itin').appendChild(row);
}
function itinerary(){ return $$('.irow').map(function(r){ return {time:r.querySelector('[data-k="time"]').value, event:r.querySelector('[data-k="event"]').value.trim()}; }).filter(function(x){ return x.time||x.event; }); }

/* ====== steppers ====== */
function setCount(name, n){ n = Math.max(0, Math.min(9, n)); $('#'+name).value = n; $('#o_'+name).textContent = n; $$('[data-step-for="'+name+'"]').forEach(function(b){ b.disabled = (+b.dataset.d<0 && n===0) || (+b.dataset.d>0 && n===9); }); }
$$('[data-step-for]').forEach(function(b){ b.addEventListener('click', function(){ var n = b.dataset.stepFor; setCount(n, (+$('#'+n).value) + (+b.dataset.d)); refresh(); saveDraftSoon(); }); });

/* ====== uploads ====== */
function totalBytes(){ var s=0; for(var k in files) files[k].forEach(function(f){ s += f.file.size; }); return s; }
function renderThumbs(cat){
  var box = $('.up[data-cat="'+cat+'"]'), ul = box.querySelector('.thumbs');
  ul.innerHTML = '';
  files[cat].forEach(function(f, i){
    var li = document.createElement('li');
    li.innerHTML = (f.file.type.indexOf('image/')===0 ? '<img alt="" src="'+f.url+'">' : '<span class="doc"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z M14 3v5h5"/></svg>'+esc(f.file.name)+'</span>') + '<button type="button" aria-label="'+esc(t('b_rmfile'))+'"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
    li.querySelector('button').addEventListener('click', function(){ try{ URL.revokeObjectURL(f.url); }catch(e){} files[cat].splice(i,1); renderThumbs(cat); });
    ul.appendChild(li);
  });
}
function addFiles(cat, list){
  var box = $('.up[data-cat="'+cat+'"]'), err = box.querySelector('.err'); err.hidden = true;
  [].slice.call(list).forEach(function(file){
    if(file.size > MAX_FILE){ err.textContent = t('e_big',{f:file.name}); err.hidden = false; return; }
    if(totalBytes() + file.size > MAX_TOTAL*2.5){ err.textContent = t('e_total'); err.hidden = false; return; }
    files[cat].push({file:file, url:URL.createObjectURL(file)});
  });
  renderThumbs(cat);
}
$$('.up').forEach(function(box){
  var cat = box.dataset.cat, inp = box.querySelector('input[type=file]'), drop = box.querySelector('.drop');
  inp.addEventListener('change', function(){ addFiles(cat, inp.files); inp.value=''; });
  ['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function(e){ if(e.dataTransfer && e.dataTransfer.files) addFiles(cat, e.dataTransfer.files); });
});
function fileToPayload(f, cat){
  return new Promise(function(resolve){
    var file = f.file;
    function asB64(blob, name, type){ var r = new FileReader(); r.onload = function(){ resolve({category:cat, name:name, mimeType:type, data:String(r.result).split(',')[1]}); }; r.onerror = function(){ resolve(null); }; r.readAsDataURL(blob); }
    if(/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)){
      var img = new Image();
      img.onload = function(){
        var max = 2000, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max/Math.max(w,h));
        var c = document.createElement('canvas'); c.width = Math.round(w*s); c.height = Math.round(h*s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function(b){ if(!b){ asB64(file, file.name, file.type); return; } asB64(b, file.name.replace(/\.[^.]+$/,'')+'.jpg', 'image/jpeg'); }, 'image/jpeg', 0.86);
      };
      img.onerror = function(){ asB64(file, file.name, file.type); };
      img.src = f.url;
    } else asB64(file, file.name, file.type || 'application/octet-stream');
  });
}

/* ====== validation ====== */
function clearErr(scope){ $$('.err', scope).forEach(function(e){ if(e.id!=='sendErr') e.hidden = true; }); $$('.invalid', scope).forEach(function(e){ e.classList.remove('invalid'); }); }
function showErr(holder, key){ var p = holder.querySelector('.err'); if(p){ p.textContent = t(key); p.hidden = false; } holder.classList.add('invalid'); }
function validate(i){
  var panel = panels[i], first = null; clearErr(panel);
  function bad(holder, key, focusEl){ showErr(holder, key); if(!first) first = focusEl || holder; }
  $$('[data-req]', panel).forEach(function(el){
    var holder = el.closest('.fld'); var v = (el.value||'').trim();
    if(!v) bad(holder, 'e_req', el);
    else if(el.dataset.email != null && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) bad(holder, 'e_email', el);
  });
  if(i===2){ if(!val('pkg')) bad($('#g_pkg'),'e_pkg'); if(!checked('langs').length) bad($('#g_langs'),'e_langs'); else if(checked('langs').indexOf('other')>-1 && !val('langs_other')) bad($('#g_langs'),'e_other'); }
  if(i===3 && !val('style')) bad($('#g_style'),'e_style');
  if(i===4 && !val('hasdesign')) bad($('#g_hasdesign'),'e_choose');
  if(i===7 && !$('#agree').checked) bad($('#g_agree'),'e_agree');
  if(first){ first.scrollIntoView({behavior:'smooth', block:'center'}); if(first.focus) try{ first.focus({preventScroll:true}); }catch(e){} return false; }
  return true;
}

/* ====== navigation ====== */
function renderNav(){
  $$('#steps button').forEach(function(b, i){
    if(i===step) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current');
    b.classList.toggle('done', i<maxStep && i!==step);
    b.disabled = i>maxStep;
  });
  $('#back').hidden = step===0;
  $('#count').textContent = t('step_of',{a:step+1,b:STEPS});
  $('#nextLbl').textContent = step===STEPS-1 ? t('b_send') : t('b_next');
  var cb = $('#steps [aria-current="step"]'); if(cb && cb.scrollIntoView){ try{ cb.scrollIntoView({block:'nearest',inline:'center'}); }catch(e){} }
}
function go(i){
  step = i; maxStep = Math.max(maxStep, i);
  panels.forEach(function(p, k){ p.hidden = k!==i; });
  if(i===STEPS-1) renderReview();
  refresh();
  window.scrollTo({top: 0, behavior: 'smooth'});
  saveDraftSoon();
}
$('#next').addEventListener('click', function(){
  if(step < STEPS-1){ if(validate(step)) go(step+1); }
  else submit();
});
$('#back').addEventListener('click', function(){ if(step>0) go(step-1); });

/* ====== review ====== */
function cap(x){ return x.charAt(0) + x.slice(1).toLowerCase(); }
function pkgNames(){ return {esencial:cap(t('pk_es_n')),completa:cap(t('pk_co_n')),premium:cap(t('pk_pr_n'))}; }
function styleName(v){ return v ? t('sty_'+v+'_n') : ''; }
function renderReview(){
  var names = pkgNames();
  var langsMap = {es:t('l_es'),he:t('l_he'),en:t('l_en'),other:val('langs_other')||t('l_other')};
  var cmap = {MX:t('c_mx'),IL:t('c_il'),OTHER:t('c_other')};
  var e = estimate();
  var nf = files.design.length + files.refs.length + files.photos.length;
  var colors = $('#nocolors').checked ? t('rv_colors_none') : $$('#swatches input').map(function(i){ return '<span style="display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px;margin-inline-end:4px;background:'+i.value+';box-shadow:0 0 0 1px rgba(0,0,0,.1)"></span>'; }).join('');
  var rows = [
    ['rv_couple', esc(val('display') || [val('p1'),val('p2')].filter(Boolean).join(' & ')), 0],
    ['rv_contact', esc([val('cname'), val('wa'), val('email')].filter(Boolean).join(' · ')), 0],
    ['rv_date', esc(val('wdate')), 1],
    ['rv_place', esc([val('venue'), val('city'), cmap[val('country')]||''].filter(Boolean).join(', ')), 1],
    ['rv_pkg', esc(names[val('pkg')]||''), 2],
    ['rv_langs', esc(checked('langs').map(function(x){ return langsMap[x]; }).join(', ')), 2],
    ['rv_guests', esc(val('guests')), 2],
    ['rv_style', esc(styleName(val('style'))), 3],
    ['rv_design', esc(val('hasdesign')==='yes' ? t('hd_yes') : val('hasdesign')==='no' ? t('hd_no') : ''), 4],
    ['rv_colors', colors, 4],
    ['rv_song', esc([val('song'), val('artist')].filter(Boolean).join(' · ')), 5],
    ['rv_files', esc(t('rv_files_v',{n:nf})), 4],
    ['rv_est', e ? '<b>'+esc(money(e.total))+'</b>' : '', 2]
  ];
  $('#review').innerHTML = rows.map(function(r){ return '<dt>'+esc(t(r[0]))+'</dt><dd>'+(r[1]||esc(t('rv_none')))+'</dd><dd><button type="button" class="ed" data-go="'+r[2]+'">'+esc(t('rv_edit'))+'</button></dd>'; }).join('');
  $$('#review .ed').forEach(function(b){ b.addEventListener('click', function(){ go(+b.dataset.go); }); });
}

/* ====== draft (this device only) ====== */
var draftT = null;
function saveDraftSoon(){ clearTimeout(draftT); draftT = setTimeout(saveDraft, 400); }
function saveDraft(){
  try{
    var data = {lang:lang, step:step, maxStep:maxStep, palette:form.dataset.palette||'', itin:itinerary(), v:{}};
    $$('input[name],select[name],textarea[name]', form).forEach(function(el){
      if(el.type==='file' || el.name==='agree') return;
      if(el.type==='checkbox'){ data.v[el.name] = data.v[el.name] || []; if(el.checked) data.v[el.name].push(el.value); }
      else if(el.type==='radio'){ if(el.checked) data.v[el.name] = el.value; }
      else data.v[el.name] = el.value;
    });
    localStorage.setItem(DRAFT_KEY, JSON.stringify(data));
  }catch(e){}
}
function loadDraft(){
  try{ var raw = localStorage.getItem(DRAFT_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function restore(d){
  if(!d) return;
  Object.keys(d.v||{}).forEach(function(n){
    var v = d.v[n];
    $$('[name="'+n+'"]', form).forEach(function(el){
      if(el.type==='checkbox') el.checked = Array.isArray(v) && v.indexOf(el.value)>-1;
      else if(el.type==='radio') el.checked = el.value===v;
      else el.value = v;
    });
  });
  if(d.v && d.v.currency) currencyTouched = true;
  setCount('x_events', +((d.v||{}).x_events)||0); setCount('x_rem', +((d.v||{}).x_rem)||0);
  if(d.itin && d.itin.length){ $('#itin').innerHTML=''; d.itin.forEach(function(r){ addRow(r.time, r.event); }); }
  if(d.palette){ var i = PALETTES.map(function(p){ return p[0]; }).indexOf(d.palette); if(i>-1){ $$('.pal').forEach(function(b){ b.setAttribute('aria-pressed', String(+b.dataset.i===i)); }); form.dataset.palette = d.palette; } }
  $('#langs_other').hidden = !$('#langsOtherChk').checked;
  paintSwatches();
  maxStep = Math.min(STEPS-1, d.maxStep||0); step = Math.min(maxStep, d.step||0);
}

/* ====== submit ====== */
function collect(){
  var e = estimate();
  return {
    type: 'details', submittedAt: new Date().toISOString(), lang: lang, currency: cur(),
    couple: {p1:val('p1'), p2:val('p2'), display:val('display')},
    contact: {name:val('cname'), whatsapp:val('wa'), email:val('email')},
    wedding: {date:val('wdate'), hebrewDate:$('#hebdate').checked, country:val('country'), city:val('city'), venue:val('venue'), address:val('address'), itinerary:itinerary(), family:val('family'), dressCode:val('dress'), quote:val('quote')},
    package: {id:val('pkg'), languages:checked('langs'), languagesOther:val('langs_other'), guests:val('guests'), saveTheDate:$('#x_std').checked, extraEvents:+val('x_events')||0, extraEventsWhich:val('x_events_which'), extraReminders:+val('x_rem')||0, rush:$('#x_urgent').checked},
    estimate: e ? {lines:e.lines.map(function(l){ return [l[0], l[1]==='inc' ? t('est_inc') : money(l[1])]; }), total:money(e.total)} : null,
    style: {id:val('style'), name:styleName(val('style')), notes:val('style_notes')},
    design: {hasDesign:val('hasdesign'), palette:$('#nocolors').checked ? [] : $$('#swatches input').map(function(i){ return i.value; }), paletteName:form.dataset.palette ? t(form.dataset.palette) : '', noColors:$('#nocolors').checked, vibes:checked('vibe').map(function(v){ return t('v_'+v); }), links:val('links')},
    music: {song:val('song'), artist:val('artist'), link:val('songlink'), start:val('songstart')},
    rsvp: {deadline:val('deadline'), menus:checked('menu').map(function(m){ return t('m_'+m); }), menuOther:val('menu_other'), extraQuestion:val('rsvp_extra'), remindersKnown:val('rem_known'), reminder1:val('rem1'), reminder2:val('rem2')},
    comments: val('comments')
  };
}
function finish(isPreview){
  form.hidden = true; $('#actbar').hidden = true; $('#hero').hidden = true; $('#steps').hidden = true;
  var n = val('display') || [val('p1'),val('p2')].filter(Boolean).join(' & ');
  $('#doneTitle').textContent = t('done_t',{n:n});
  $('#donePreview').hidden = !isPreview;
  $('#done').hidden = false; window.scrollTo({top:0});
  if(!isPreview){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
}
function submit(){
  for(var i=0;i<STEPS;i++){ if(!validate(i)){ go(i); validate(i); return; } }
  var btn = $('#next'), err = $('#sendErr'); err.hidden = true;
  if(!ENDPOINT){ finish(true); return; }
  btn.disabled = true; $('#nextLbl').textContent = t('b_sending');
  var data = collect(), jobs = [];
  Object.keys(files).forEach(function(cat){ files[cat].forEach(function(f){ jobs.push(fileToPayload(f, cat)); }); });
  Promise.all(jobs).then(function(list){
    data.files = list.filter(Boolean);
    var size = data.files.reduce(function(s,f){ return s + f.data.length*0.75; }, 0);
    if(size > MAX_TOTAL) throw new Error('too_big');
    return fetch(ENDPOINT, {method:'POST', body:JSON.stringify(data)});
  }).then(function(r){ return r.json(); }).then(function(res){
    if(!res || !res.ok) throw new Error((res && res.error) || 'failed');
    finish(false);
  }).catch(function(e){
    err.textContent = e && e.message==='too_big' ? t('e_total') : t('e_send'); err.hidden = false;
    btn.disabled = false; $('#nextLbl').textContent = t('b_send');
    err.scrollIntoView({behavior:'smooth', block:'center'});
  });
}

/* ====== events ====== */
form.addEventListener('input', function(e){ var h = e.target.closest('.invalid'); if(h){ h.classList.remove('invalid'); var p = h.querySelector('.err'); if(p) p.hidden = true; } if(e.target.type==='color'){ e.target.parentNode.style.background = e.target.value; $$('.pal').forEach(function(b){ b.setAttribute('aria-pressed','false'); }); form.dataset.palette=''; } refresh(); saveDraftSoon(); });
form.addEventListener('change', function(e){ if(e.target.name==='currency') currencyTouched = true; var g = e.target.closest('.grp.invalid'); if(g){ g.classList.remove('invalid'); var p = g.querySelector('.err'); if(p) p.hidden = true; } refresh(); saveDraftSoon(); });
form.addEventListener('submit', function(e){ e.preventDefault(); });
$('#langsOtherChk').addEventListener('change', function(){ var i = $('#langs_other'); i.hidden = !this.checked; if(this.checked) i.focus(); else i.value=''; });
$('#addRow').addEventListener('click', function(){ addRow(); var ins = $$('.irow input[type=time]'); ins[ins.length-1].focus(); });
$$('.langs button').forEach(function(b){ b.addEventListener('click', function(){ applyLang(b.dataset.lang); saveDraftSoon(); }); });

/* ====== boot ====== */
buildStatic();
var draft = loadDraft();
var hashLang = (location.hash||'').replace('#','');
var navLang = (navigator.language||'es').slice(0,2);
var startLang = ['es','he','en'].indexOf(hashLang)>-1 ? hashLang : (draft && draft.lang) || (['he','en'].indexOf(navLang)>-1 ? navLang : 'es');
addRow('19:00',''); addRow('20:00','');
setPalette(0);
setCount('x_events',0); setCount('x_rem',0);
restore(draft);
applyLang(startLang);
panels.forEach(function(p, k){ p.hidden = k!==step; });
if(step===STEPS-1) renderReview();
$('#previewNote').hidden = !!ENDPOINT;
refresh();
window.addEventListener('hashchange', function(){ var h = location.hash.replace('#',''); if(['es','he','en'].indexOf(h)>-1) applyLang(h); });
})();
</script>

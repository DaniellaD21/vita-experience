<title>Vita Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=Frank+Ruhl+Libre:wght@300;400;500&family=Heebo:wght@300;400;500;600&display=swap">
<style>
/* Layout: one screen at a time, like opening an envelope: welcome, the live demo, a one-minute quote, thanks. Single light look on purpose: the Vita palette (warm ivory paper, soft sand, muted sage, gold leaf, rosa mexicano). */
:root{
  --ivory:#F8F6F1; --paper:#FFFDF9; --sand:#D8CFC2; --sand-2:#E9E3D8; --sand-3:#F1ECE3;
  --sage:#A5AA98; --sage-ink:#5E6253; --ink:#2F3129;
  --gold:#B8913A; --gold-hi:#E6CF94; --gold-lo:#8E6F33; --line:rgba(184,145,58,.38); --line-soft:rgba(184,145,58,.2);
  --rosa:#E4007C; --rosa-ink:#C4006B; --rosa-deep:#A8005C;
  --foil:linear-gradient(100deg,#8E6F33 0%,#D9B45B 30%,#B8913A 50%,#E6CF94 68%,#9C7A3A 100%);
  --f-display:'Instrument Serif','Didot',Georgia,serif;
  --f-label:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
  --f-body:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
:root[dir="rtl"]{ --f-display:'Frank Ruhl Libre','Times New Roman',serif; --f-body:'Heebo','Arial Hebrew',Arial,sans-serif; --f-label:'Heebo','Arial Hebrew',Arial,sans-serif; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ivory)}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--f-body);font-weight:400;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ivory)}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 45% at 50% -8%,rgba(216,207,194,.9),transparent 70%),radial-gradient(ellipse 50% 40% at 100% 100%,rgba(165,170,152,.22),transparent 70%),radial-gradient(ellipse 40% 35% at 0% 100%,rgba(228,0,124,.06),transparent 70%),var(--ivory)}
.bg::after{content:"";position:absolute;inset:0;opacity:.08;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.frame{position:fixed;inset:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));border:1px solid var(--line);pointer-events:none;z-index:1}
.frame::after{content:"";position:absolute;inset:4px;border:1px solid var(--line-soft)}
.frame i{position:absolute;width:8px;height:8px;border:1px solid var(--gold);background:var(--ivory);transform:rotate(45deg)}
.frame i:nth-child(1){top:-5px;left:-5px}.frame i:nth-child(2){top:-5px;right:-5px}.frame i:nth-child(3){bottom:-5px;left:-5px}.frame i:nth-child(4){bottom:-5px;right:-5px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--rosa-ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--rosa);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:40;padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:max(30px,env(safe-area-inset-right,0px));padding-block:22px 22px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;background:linear-gradient(var(--ivory) 62%,rgba(248,246,241,0))}
.top > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{height:26px;width:auto}
.brand span{font-family:var(--f-label);font-size:10.5px;font-weight:500;letter-spacing:.34em;text-transform:uppercase}
.langs{display:flex}
.langs button{background:none;border:0;padding:8px 9px;min-height:36px;font-family:var(--f-label);font-size:11.5px;font-weight:500;letter-spacing:.14em;color:var(--sage-ink);cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--rosa-ink)}
.langs button + button{border-inline-start:1px solid var(--line)}

main{position:relative;z-index:2}
.scr{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:max(30px,env(safe-area-inset-right,0px));padding-block:110px 72px}
.scr[hidden]{display:none!important}
.scr.in > *{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.scr.in > *:nth-child(2){animation-delay:.08s}.scr.in > *:nth-child(3){animation-delay:.16s}.scr.in > *:nth-child(4){animation-delay:.24s}.scr.in > *:nth-child(5){animation-delay:.32s}.scr.in > *:nth-child(6){animation-delay:.4s}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--f-label);font-size:11px;font-weight:500;letter-spacing:.36em;text-transform:uppercase;color:var(--gold-lo);margin:0;display:flex;align-items:center;gap:14px;justify-content:center}
.eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:var(--gold)}
:root[dir="rtl"] .eyebrow{letter-spacing:.04em;font-size:14px}
.display{font-family:var(--f-display);font-weight:400;font-style:normal;letter-spacing:-.012em;line-height:1.02;margin:0;color:var(--ink);text-wrap:balance}
.display em,.it{font-style:italic}
:root[dir="rtl"] .display{font-weight:300;letter-spacing:0;line-height:1.12}
.foil{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:foil 9s ease-in-out infinite;font-style:italic;padding-inline-end:.06em}
:root[dir="rtl"] .foil{font-style:normal}
@keyframes foil{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.lead{color:var(--sage-ink);font-size:clamp(15.5px,1.6vw,17.5px);max-width:33em;margin:0 auto;text-wrap:pretty}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:58px;padding:0 38px;border:0;border-radius:1px;cursor:pointer;text-decoration:none;font-family:var(--f-label);font-size:12px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .3s ease,background .2s ease}
:root[dir="rtl"] .btn{letter-spacing:.04em;font-size:15px}
.btn-pri{background:var(--rosa-ink);color:var(--ivory);box-shadow:inset 0 0 0 1px rgba(230,207,148,.55),inset 0 0 0 5px var(--rosa-ink),inset 0 0 0 6px rgba(230,207,148,.45),0 14px 30px -14px rgba(196,0,107,.55)}
.btn-pri::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .9s ease}
.btn-pri:hover::after{transform:translateX(120%)}
.btn-pri:hover{background:var(--rosa-deep);transform:translateY(-1px)}
.btn-line{background:transparent;color:var(--ink);border:1px solid var(--gold)}
.btn-line:hover{background:var(--paper)}
.btn-ink{background:var(--rosa-ink);color:var(--ivory);width:100%;box-shadow:inset 0 0 0 1px rgba(230,207,148,.55),inset 0 0 0 5px var(--rosa-ink),inset 0 0 0 6px rgba(230,207,148,.45)}
.btn-ink:hover{background:var(--rosa-deep)}
.btn-ink:disabled{opacity:.6;cursor:progress}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
:root[dir="rtl"] .btn svg.arr{transform:scaleX(-1)}
.link{background:none;border:0;padding:8px 4px;color:var(--sage-ink);font-size:14px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}
.link:hover{color:var(--rosa-ink)}

#welcome{text-align:center}
.wv{display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center;max-width:100%}
.mono{width:min(124px,30vw);height:auto;filter:drop-shadow(0 10px 18px rgba(142,111,51,.22))}
.wm{font-family:var(--f-label);font-size:11.5px;font-weight:500;letter-spacing:.62em;text-transform:uppercase;color:var(--ink);margin:-8px 0 0;padding-inline-start:.62em}
.w-ctas{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px}
.w-note{font-size:13px;color:var(--sage-ink);letter-spacing:.04em}
.marks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 30px;margin-top:22px;padding-top:24px;border-top:1px solid var(--line);max-width:660px;width:100%}

var SCREENS = ['welcome','demo','quote','thanks'];
var lang = 'es', current = 'welcome', sent = false, demoOpened = false;
var PREVIEW = !ENDPOINT;
var form = document.getElementById('q');
function $(s){ return document.querySelector(s); }
function $$(s){ return [].slice.call(document.querySelectorAll(s)); }
function t(k, v){ var s = I18N[lang][k]; if(s == null) s = I18N.es[k]; if(s == null) s = k; if(v) for(var x in v) s = s.split('{'+x+'}').join(v[x]); return s; }
function radio(n){ var r = form.querySelector('input[name="'+n+'"]:checked'); return r ? r.value : ''; }

function currency(){ var c = radio('country'); if(c==='MX') return 'MXN'; if(c==='IL') return 'ILS'; return lang==='es' ? 'MXN' : 'ILS'; }

function applyLang(l){
  (function(){ var dv=document.getElementById('demoVid'); if(!dv) return; var en=l==='en'; var src=en?'demo-en.mp4':'demo.mp4'; if(dv.getAttribute('src')!==src){ var playing=!dv.paused; dv.setAttribute('poster', en?'demo-poster-en.jpg':'demo-poster.jpg'); dv.setAttribute('src',src); dv.load(); if(playing) dv.play().catch(function(){}); } })();
  lang = l; var r = document.documentElement; r.lang = l; r.dir = l==='he' ? 'rtl' : 'ltr';
  $$('.langs button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang===l)); });
  $$('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
  refresh();
}
function refresh(){
  $('#sendLbl').textContent = t('q_send');
  if(sent) $('#tTitle').textContent = t('t_title',{n:$('#names').value.trim()});
}
function checkedVals(n){ return [].slice.call(form.querySelectorAll('input[name="'+n+'"]:checked')).map(function(i){ return i.value; }); }

document.addEventListener('click', function(e){
  var b = e.target.closest('.langs button[data-lang]'); if(!b) return;
  e.preventDefault(); applyLang(b.dataset.lang);
  try{ localStorage.setItem('vx_lang', b.dataset.lang); }catch(x){}
});

/* ===== screens ===== */
function show(id, push){
  if(SCREENS.indexOf(id)<0) id = 'welcome';
  if(id==='thanks' && !sent) id = 'quote';
  current = id;
  document.getElementById('deco').classList.add('on');
  SCREENS.forEach(function(s){ var el = document.getElementById(s); el.hidden = s!==id; el.classList.toggle('in', s===id); });
  var dock = $('#dock'); dock.classList.toggle('show', id==='demo');
  if(id==='demo'){ demoOpened = true; playDemo(); } else if(vid){ try{ vid.pause(); }catch(e){} }
  window.scrollTo(0,0);
  if(push !== false){ var h = id==='welcome' ? '' : '#'+id; try{ if(location.hash !== h) history.pushState(null, '', h || location.pathname); }catch(e){ location.hash = h; } }
  var heading = document.getElementById(id).querySelector('h1,h2'); if(heading){ heading.setAttribute('tabindex','-1'); try{ heading.focus({preventScroll:true}); }catch(e){} }
}
$$('[data-go]').forEach(function(b){ b.addEventListener('click', function(e){ e.preventDefault(); show(b.dataset.go); }); });
window.addEventListener('popstate', function(){ show((location.hash||'').replace('#','') || 'welcome', false); });
window.addEventListener('hashchange', function(){ var h = (location.hash||'').replace('#',''); if(['es','he','en'].indexOf(h)>-1){ applyLang(h); return; } if(h!==current) show(h || 'welcome', false); });

/* ===== demo ===== */
var vid = $('#demoVid');
function playDemo(){ if(!vid) return; try{ vid.currentTime = 0; var p = vid.play(); if(p && p.catch) p.catch(function(){}); }catch(e){} }
/* ===== quote ===== */
$('#langOtherChk').addEventListener('change', function(){ var i = $('#langOther'); i.hidden = !this.checked; if(this.checked) setTimeout(function(){ i.focus(); }, 30); else i.value=''; });
$('#nodate').addEventListener('change', function(){ $('#date').disabled = this.checked; if(this.checked) $('#date').value=''; clear($('#date').closest('.f')); });
form.addEventListener('change', function(e){ var f = e.target.closest('.f'); if(f) clear(f); refresh(); });
form.addEventListener('input', function(e){ var f = e.target.closest('.f'); if(f) clear(f); });
function clear(f){ f.classList.remove('bad'); var p = f.querySelector('.err'); if(p) p.hidden = true; }
function bad(f, k){ f.classList.add('bad'); var p = f.querySelector('.err'); p.textContent = t(k); p.hidden = false; }
var qstep = 0;
function setQStep(n){
  qstep = n;
  $$('.qpanel').forEach(function(p){ p.hidden = +p.dataset.qp !== n; });
  $$('.qs').forEach(function(x){ var k = +x.dataset.qs; x.classList.toggle('on', k===n); x.classList.toggle('done', k<n); });
  $('.card').scrollIntoView({behavior:'smooth', block:'start'});
}
function validate(step){
  var first = null;
  function mark(key, msg){ var f = form.querySelector('[data-req="'+key+'"]'); bad(f, msg); if(!first) first = f; }
  if(step===0){
    if(!$('#names').value.trim()) mark('names','e_req');
    if(!radio('country')) mark('country','e_choose');
    if(!$('#date').value && !$('#nodate').checked) mark('date','e_req');
    if(!radio('guests')) mark('guests','e_choose');
    var lv = checkedVals('langs'); if(!lv.length) mark('langs','e_lang'); else if(lv.indexOf('other')>-1 && !$('#langOther').value.trim()) mark('langs','e_other');
  } else {
    ['design','send','events','std'].forEach(function(k){ if(!radio(k)) mark(k,'e_choose'); });
    var wa = $('#wa').value.replace(/[^\d+]/g,''); if(wa.replace(/\D/g,'').length < 8) mark('wa','e_wa');
  }
  if(first){ first.scrollIntoView({behavior:'smooth', block:'center'}); var i = first.querySelector('input'); if(i) try{ i.focus({preventScroll:true}); }catch(e){} return false; }
  return true;
}
$('#qNext').addEventListener('click', function(){ if(validate(0)) setQStep(1); });
$('#qPrev').addEventListener('click', function(){ setQStep(0); });
form.addEventListener('change', function(e){ if(e.target.name==='events'){ var w = $('#eventsWhich'); w.hidden = e.target.value==='0'; if(w.hidden) w.value=''; } });
function fmtDate(v){ try{ var p = v.split('-'); var dt = new Date(+p[0], +p[1]-1, +p[2]); return dt.toLocaleDateString({es:'es-MX',he:'he-IL',en:'en-US'}[lang], {day:'numeric', month:'long', year:'numeric'}); }catch(e){ return v; } }
function labels(){
  var g = {'150':t('g1'),'300':t('g2'),'500':t('g3'),'501':t('g4')}[radio('guests')] || '';
  var map = {es:t('l_es'),he:t('l_he'),en:t('l_en')}; var p = checkedVals('langs').map(function(x){ return x==='other' ? ($('#langOther').value.trim() || t('l_other')) : map[x]; }).join(', ');
  var d = $('#nodate').checked || !$('#date').value ? t('wa_nodate') : t('date_pre') + fmtDate($('#date').value);
  return {g:g, p:p, d:d};
}
function thanks(){
  sent = true;
  var n = $('#names').value.trim(), L = labels();
  $('#tTitle').textContent = t('t_title',{n:n});
  var msg = t('wa_msg',{n:n, d:L.d, g:L.g, p:L.p});
  $('#waLink').href = 'https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(msg);
  show('thanks');
}
form.addEventListener('submit', function(e){
  e.preventDefault();
  if(qstep===0){ if(validate(0)) setQStep(1); return; }
  if(!validate(1)) return;
  if(PREVIEW){ thanks(); return; }
  var btn = $('#send'), err = $('#sendErr'); err.hidden = true; btn.disabled = true; $('#sendLbl').textContent = t('q_sending');
  var L = labels(), c = currency(), q = {};
  try{ new URLSearchParams(location.search).forEach(function(v,k){ if(/^utm_|^ref$|^src$/.test(k)) q[k]=v; }); }catch(x){}
  var payload = {type:'lead', submittedAt:new Date().toISOString(), lang:lang, names:$('#names').value.trim(), country:radio('country'), currency:c,
    date:$('#date').value, noDate:$('#nodate').checked, guests:L.g, guestsRange:radio('guests'), languages:L.p, languageCodes:checkedVals('langs'), languageOther:$('#langOther').value.trim(),
    design:radio('design'), send:radio('send'), events:+radio('events'), eventsWhich:$('#eventsWhich').value.trim(), saveTheDate:radio('std')==='yes', services:checkedVals('services'), whatsapp:$('#wa').value.trim(), sawDemo:demoOpened, source:q, page:location.origin+location.pathname};
  fetch(ENDPOINT, {method:'POST', body:JSON.stringify(payload)})
    .then(function(r){ return r.json(); })
    .then(function(r){ if(!r || !r.ok) throw new Error('fail'); thanks(); })
    .catch(function(){ err.textContent = t('e_send'); err.hidden = false; btn.disabled = false; $('#sendLbl').textContent = t('q_send'); });
});

/* ===== boot ===== */
var h = (location.hash||'').replace('#','');
var nav = (navigator.language||'es').slice(0,2);
var saved = null; try{ saved = localStorage.getItem('vx_lang'); }catch(x){}
applyLang(['es','he','en'].indexOf(h)>-1 ? h : (['es','he','en'].indexOf(saved)>-1 ? saved : (['he','en'].indexOf(nav)>-1 ? nav : 'es')));
$('#previewNote').hidden = !PREVIEW;
show(SCREENS.indexOf(h)>-1 ? h : 'welcome', false);
})();
</script>
